name: Build Android App (dev)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-app-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: NotionManagementApp/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        working-directory: NotionManagementApp
        run: npm ci

      - name: Build Android debug APK
        working-directory: NotionManagementApp
        run: |
          api_url=$(jq -r '.android.developmentApiUrl' ../deployment/config/development.json)
          printf 'VITE_INBOX_API_URL=%s\n' "$api_url" > .env.development-phone
          npm run build -- --mode development-phone
          npm exec cap sync android
          chmod +x android/gradlew
          (
            cd android
            ./gradlew --no-daemon assembleDebug
          )

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NotionManagementApp-dev-debug-apk
          path: NotionManagementApp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK to Google Drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_APK_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_APK_FOLDER_ID }}
        run: |
          test -n "$GOOGLE_DRIVE_CLIENT_ID"
          test -n "$GOOGLE_DRIVE_CLIENT_SECRET"
          test -n "$GOOGLE_DRIVE_REFRESH_TOKEN"
          test -n "$GOOGLE_DRIVE_APK_FOLDER_ID"

          apk_path=NotionManagementApp/android/app/build/outputs/apk/debug/app-debug.apk
          apk_name="NotionManagementApp-dev-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          apk_size=$(stat --printf='%s' "$apk_path")

          response_file=$(mktemp)
          headers_file=$(mktemp)
          trap 'rm -f "$response_file" "$headers_file"' EXIT

          report_google_error() {
            local step="$1"
            local status="$2"
            local message
            message=$(jq --raw-output '.error_description // .error.message // .error // "Google returned no error details."' "$response_file" 2> /dev/null)
            echo "::error title=Google Drive $step failed::HTTP $status: $message"
          }

          if ! token_status=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --request POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GOOGLE_DRIVE_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_DRIVE_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_DRIVE_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token' \
            --output "$response_file" \
            --write-out '%{http_code}'); then
            echo '::error title=Google OAuth token request failed::The request could not reach Google.'
            exit 1
          fi

          if [[ ! "$token_status" =~ ^2 ]]; then
            report_google_error 'OAuth token request' "$token_status"
            exit 1
          fi

          access_token=$(jq --exit-status --raw-output '.access_token' "$response_file")

          metadata=$(jq --null-input --compact-output \
            --arg name "$apk_name" \
            --arg parent "$GOOGLE_DRIVE_APK_FOLDER_ID" \
            '{name: $name, parents: [$parent]}')

          if ! session_status=$(curl --silent --show-error \
            --request POST 'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,webViewLink' \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json; charset=UTF-8' \
            --header 'X-Upload-Content-Type: application/vnd.android.package-archive' \
            --header "X-Upload-Content-Length: $apk_size" \
            --data "$metadata" \
            --dump-header "$headers_file" \
            --output "$response_file" \
            --write-out '%{http_code}'); then
            echo '::error title=Google Drive upload session failed::The request could not reach Google Drive.'
            exit 1
          fi

          if [[ ! "$session_status" =~ ^2 ]]; then
            report_google_error 'upload session' "$session_status"
            exit 1
          fi

          upload_url=$(awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2 }' "$headers_file")
          if [[ -z "$upload_url" ]]; then
            echo '::error title=Google Drive upload session failed::Google did not return an upload URL.'
            exit 1
          fi

          if ! upload_status=$(curl --silent --show-error \
            --request PUT "$upload_url" \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/vnd.android.package-archive' \
            --header "Content-Length: $apk_size" \
            --upload-file "$apk_path" \
            --output "$response_file" \
            --write-out '%{http_code}'); then
            echo '::error title=Google Drive file upload failed::The APK could not be sent to Google Drive.'
            exit 1
          fi

          if [[ ! "$upload_status" =~ ^2 ]]; then
            report_google_error 'file upload' "$upload_status"
            exit 1
          fi

          echo "Google Drive file ID: $(jq --exit-status --raw-output '.id' "$response_file")"
          echo "Google Drive file URL: $(jq --exit-status --raw-output '.webViewLink' "$response_file")"

apply plugin: 'com.android.application'

import java.util.Properties

def localSigningProperties = new Properties()
def localSigningPropertiesFile = rootProject.file('signing.properties')
if (localSigningPropertiesFile.exists()) {
    localSigningPropertiesFile.withInputStream { localSigningProperties.load(it) }
}

def signingValues = [
    storeFile    : System.getenv('ANDROID_DEV_KEYSTORE_PATH') ?: localSigningProperties.getProperty('storeFile'),
    storePassword: System.getenv('ANDROID_DEV_KEYSTORE_PASSWORD') ?: localSigningProperties.getProperty('storePassword'),
    keyAlias     : System.getenv('ANDROID_DEV_KEY_ALIAS') ?: localSigningProperties.getProperty('keyAlias'),
    keyPassword  : System.getenv('ANDROID_DEV_KEY_PASSWORD') ?: localSigningProperties.getProperty('keyPassword')
]
def providedSigningValueCount = signingValues.count { _, value -> value?.trim() }
if (providedSigningValueCount > 0 && providedSigningValueCount < signingValues.size()) {
    throw new GradleException('Development APK signing configuration is incomplete.')
}
def hasDevelopmentSigning = providedSigningValueCount == signingValues.size()

android {
    namespace = "pl.notionmanagement.inbox"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.notionmanagement.inbox"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasDevelopmentSigning) {
        def keyStoreFile = rootProject.file(signingValues.storeFile)
        if (!keyStoreFile.isFile()) {
            throw new GradleException("Development keystore was not found: $keyStoreFile")
        }

        signingConfigs {
            development {
                storeFile keyStoreFile
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (hasDevelopmentSigning) {
                signingConfig signingConfigs.development
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
